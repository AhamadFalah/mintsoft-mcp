[project]
name = "mintsoft-mcp"
version = "0.1.0"
description = "MCP server exposing the Mintsoft WMS API as LLM tools — read-only by default, writes gated behind an explicit client allowlist, every call audit-logged."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Falah Ahamad" }]
keywords = ["mcp", "mintsoft", "wms", "3pl", "warehouse", "llm", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31.0",
]

[project.scripts]
mintsoft-mcp = "mintsoft_mcp.server:main"

[project.urls]
Homepage = "https://github.com/AhamadFalah/mintsoft-mcp"
Issues = "https://github.com/AhamadFalah/mintsoft-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mintsoft_mcp"]

[tool.ruff]
line-length = 120
