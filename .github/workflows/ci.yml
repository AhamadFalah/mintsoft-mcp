name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff .
      - name: Lint
        run: ruff check src scripts
      - name: Tool registration (read-only mode)
        run: |
          python -c "
          from mintsoft_mcp import server
          n = len(server.mcp._tool_manager._tools)
          assert n == 37, f'expected 37 read tools, got {n}'
          print(f'read-only mode: {n} tools')
          "
      - name: Tool registration (writes mode)
        env:
          MINTSOFT_ENABLE_WRITES: "1"
          MINTSOFT_WRITE_CLIENT_ALLOWLIST: "999999"
        run: |
          python -c "
          from mintsoft_mcp import server
          n = len(server.mcp._tool_manager._tools)
          assert n == 45, f'expected 45 tools with writes on, got {n}'
          assert server.WRITE_ALLOWLIST == {999999}
          print(f'writes mode: {n} tools, allowlist ok')
          "
      - name: Entry point resolves
        run: python -c "from mintsoft_mcp.server import main; print('entry point ok')"
