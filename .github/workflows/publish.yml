name: Publish

# Cutting a GitHub Release publishes the package to PyPI (Trusted Publishing,
# no tokens) and then the server to the MCP registry (GitHub OIDC).
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pipx run build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # registry auth for the io.github.ahamadfalah namespace
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for PyPI to index the release
        run: |
          for i in $(seq 1 20); do
            curl -sf "https://pypi.org/pypi/mintsoft-mcp/json" >/dev/null && exit 0
            sleep 15
          done
          echo "package not visible on PyPI yet" >&2; exit 1
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
